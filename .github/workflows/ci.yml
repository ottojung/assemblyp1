name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check research documentation integrity
        run: python3 scripts/check-research-docs.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4

      # Reuse the Mathlib sources and its downloaded binary cache between runs.
      - name: Restore Mathlib packages and cache
        id: mathlib-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: mathlib-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # Reuse precompiled objects to avoid needless rebuilds. These are only
      # accelerators: a full library build and audit are mandatory below.
      - name: Restore compiled Lean objects
        id: compiled-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-full-${{ github.sha }}
          restore-keys: |
            lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-checkpoint-
            lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-orbit-
            lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-full-
            lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-seed-

      - name: Bootstrap from successful support-descent artifact
        id: bootstrap
        if: steps.compiled-cache.outputs.cache-matched-key == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: support-descent-build
          repository: ${{ github.repository }}
          run-id: 37842180341
          github-token: ${{ github.token }}
          path: .lake/build

      # Save the bootstrap BEFORE attempting the remaining build. A killed
      # runner can no longer discard this already-compiled baseline.
      # The proof was compiled with --wfail and kernel-replayed on the
      # matching Lean 4.34 toolchain. Never use it for changed proof sources.
      - name: Persist initial Lean checkpoint
        if: steps.compiled-cache.outputs.cache-matched-key == '' && steps.bootstrap.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-seed-${{ github.sha }}

      - name: Runner diagnostics and swap
        run: |
          echo "Memory before build"
          free -h
          df -h .
          echo "Cgroup memory limit (if applicable):"
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true
          sudo fallocate -l 6G /mnt/lean-ci.swap
          sudo chmod 600 /mnt/lean-ci.swap
          sudo mkswap /mnt/lean-ci.swap
          sudo swapon /mnt/lean-ci.swap
          free -h

      - name: Install Lean and restore Mathlib binary cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false

      # Keep heartbeat and memory diagnostics in the SAME step as the compiler.
      # A separate background step loses its log if GitHub terminates the job.
      # Persist the expensive Mathlib download independently of the project
      # build; otherwise every failed build discards it.
      - name: Persist Mathlib dependency cache
        if: steps.mathlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages
          key: mathlib-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # Cache the fixed toolchain + commit audit binary. Building it should
      # not be repeated at the end of every long proof pass.
      - name: Restore pinned axiom audit
        id: audit-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/axiom-audit
          key: axiom-audit-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-46024e005996495c65ef609368e11ab39c4222e3

      - name: Build pinned axiom audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .ci-cache
          git clone --quiet --depth 1 --branch v0.1.2             https://github.com/leanprover-community/axiom-audit.git .ci-cache/axiom-audit
          test "$(git -C .ci-cache/axiom-audit rev-parse HEAD)" =             46024e005996495c65ef609368e11ab39c4222e3
          cp lean-toolchain .ci-cache/axiom-audit/
          (cd .ci-cache/axiom-audit && lake build)

      - name: Persist pinned axiom audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/axiom-audit
          key: axiom-audit-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-46024e005996495c65ef609368e11ab39c4222e3

      # Cheap local elaboration failure before the costly 37-minute proof.
      # More expensive import-chain preflight runs only after the orbit proof
      # has already been durably checkpointed.
      - name: Preflight standalone triple-bridge module
        run: lake build AssemblyP1.BBTTripleBridge --wfail

      # Previously this one theorem module took ~2,207 s. Persist its compiled
      # object and transitive deps BEFORE attempting any other theorem module.
      # Lake's source fingerprints still rebuild stale oleans on later commits.
      - name: Build expensive orbit-search proof first
        run: lake build AssemblyP1.Issue94OrbitSearch --wfail

      - name: Checkpoint compiled expensive theorem
        if: steps.compiled-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-orbit-${{ github.run_id }}-${{ github.run_attempt }}

      # Run the expensive shared-import preflight AFTER the orbit checkpoint:
      # Issue94KShort imports orbit-search transitively, so putting it first
      # would pay 37 minutes yet fail before preserving that compiled result.
      - name: Preflight formerly failing import chains
        run: |
          lake build AssemblyP1.Issue94KShort             AssemblyP1.Issue94KShortGeneral             AssemblyP1.Issue94ComponentAlignedSwaps --wfail

      # The endpoint module imports only a subset of the project. The default
      # Lake library target compiles every AssemblyP1/*.lean module, including
      # independent results not imported by Issue94Complete.
      - name: Build every Lean theorem module with live memory diagnostics
        id: all-proofs
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Full Lean library build starting ==="
          (
            while true; do
              echo "=== Build heartbeat $(date -u +%FT%TZ) ==="
              free -m
              ps -eo pid,ppid,rss,vsz,pcpu,stat,comm --sort=-rss | sed -n '1,9p'
              cat /proc/pressure/memory || true
              sleep 30
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          # Lake 4.34 does not support -j; LEAN_NUM_THREADS (set at the
          # job level) is the supported way to limit its worker threads.
          lake build --wfail

      # A failed near-complete proof build must not throw away its successful
      # oleans. Lake traces still invalidate every source changed on retry.
      - name: Checkpoint compiled Lean objects after failure
        if: failure()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save full compiled Lean cache
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-full-${{ github.sha }}

      # Lean 4.34 infers "Assemblyp1" from the lower-case package name
      # when no argument is passed; our actual module prefix is "AssemblyP1".
      # This prefix selects every built module, not just the final endpoint.
      - name: Replay entire Lean library through the kernel
        run: |
          LEAN_NUM_THREADS=1 lake env leanchecker AssemblyP1

      # Audit declarations from all source modules, including modules not
      # imported by the aggregator or the final #94 endpoint. In particular,
      # --modules-from avoids silently omitting standalone theorem files.
      - name: Audit axioms in every theorem module
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$PWD/.ci-cache/axiom-audit"
          test "$(git -C "$audit_dir" rev-parse HEAD)" =             46024e005996495c65ef609368e11ab39c4222e3
          test -x "$audit_dir/.lake/build/bin/axiom-audit"
          lake env "$audit_dir/.lake/build/bin/axiom-audit" \
            --allow propext,Classical.choice,Quot.sound \
            --root AssemblyP1 --modules-from AssemblyP1
