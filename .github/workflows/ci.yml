name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check research documentation integrity
        run: python3 scripts/check-research-docs.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4

      # Reuse the Mathlib sources and its downloaded binary cache between runs.
      - name: Restore Mathlib packages and cache
        id: mathlib-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: mathlib-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # A complete checkpoint from an earlier successful stage provides a
      # bootstrap even though the old 17-job chain never reached its final job.
      # Once a full cache exists, neither this download nor the seed save runs.
      - name: Restore compiled Lean objects
        id: compiled-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-full-${{ github.sha }}
          restore-keys: |
            lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-full-
            lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-seed-

      - name: Bootstrap from successful support-descent artifact
        id: bootstrap
        if: steps.compiled-cache.outputs.cache-matched-key == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: support-descent-build
          repository: ${{ github.repository }}
          run-id: 37842180341
          github-token: ${{ github.token }}
          path: .lake/build

      # Save the bootstrap BEFORE attempting the remaining build. A killed
      # runner can no longer discard this already-compiled baseline.
      # The proof was compiled with --wfail and kernel-replayed on the
      # matching Lean 4.34 toolchain. Never use it for changed proof sources.
      - name: Restore verified endpoint build
        id: verified-endpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags --depth=1 origin c1d9f95917b937911fb08a6f2c59bcfcd152b774
          if ! git diff --quiet FETCH_HEAD HEAD -- AssemblyP1 lean-toolchain lake-manifest.json lakefile.toml; then
            echo "Proof sources differ; compile from source."
            echo "used=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet --no-tags --depth=1 origin ci-cache/lean4.34-p2-oct8
          git show FETCH_HEAD:full-build-cache.tar.gz > "$RUNNER_TEMP/full-build-cache.tar.gz"
          echo "7809cf63aeebd05f7ef85d81ac5546a2aea26b9aaa45054ebd4a76bd0189bf5d  $RUNNER_TEMP/full-build-cache.tar.gz" | sha256sum -c -
          mkdir -p .lake/build
          tar -xzf "$RUNNER_TEMP/full-build-cache.tar.gz" -C .lake/build
          echo "used=true" >> "$GITHUB_OUTPUT"

      - name: Persist initial Lean checkpoint
        if: steps.compiled-cache.outputs.cache-matched-key == '' && steps.bootstrap.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-seed-${{ github.sha }}

      - name: Runner diagnostics and swap
        run: |
          echo "Memory before build"
          free -h
          df -h .
          echo "Cgroup memory limit (if applicable):"
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true
          sudo fallocate -l 6G /mnt/lean-ci.swap
          sudo chmod 600 /mnt/lean-ci.swap
          sudo mkswap /mnt/lean-ci.swap
          sudo swapon /mnt/lean-ci.swap
          free -h

      - name: Install Lean and restore Mathlib binary cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false

      # Keep heartbeat and memory diagnostics in the SAME step as the compiler.
      # A separate background step loses its log if GitHub terminates the job.
      # Persist the expensive Mathlib download independently of the project
      # build; otherwise every failed build discards it.
      - name: Persist Mathlib dependency cache
        if: steps.mathlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages
          key: mathlib-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Build complete theorem with live memory diagnostics
        if: steps.verified-endpoint.outputs.used != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Lean build starting ==="
          (
            while true; do
              echo "=== Build heartbeat $(date -u +%FT%TZ) ==="
              free -m
              ps -eo pid,ppid,rss,vsz,pcpu,stat,comm --sort=-rss | sed -n '1,9p'
              cat /proc/pressure/memory || true
              sleep 30
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          timeout --signal=TERM --kill-after=15s 900s lake build +AssemblyP1.Issue94Complete --wfail

      - name: Save full compiled Lean cache
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-full-${{ github.sha }}

      - name: Replay final theorem through the Lean kernel
        run: |
          LEAN_NUM_THREADS=1 lake env leanchecker AssemblyP1.Issue94Complete

      # lean-action's bundled audit helper calls bare 'lake build' even when
      # build: false. That unnecessarily rebuilds every module (including
      # unrelated high-memory research code) and OOMs hosted runners.
      # Invoke the same pinned audit tool directly over the kernel-checked
      # endpoint .olean artifacts instead.
      - name: Audit final theorem axioms without full-project rebuild
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/axiom-audit.XXXXXX")"
          trap 'rm -rf "$workdir"' EXIT
          audit_dir="$workdir/axiom-audit"
          git clone --quiet --depth 1 --branch v0.1.2 \
            https://github.com/leanprover-community/axiom-audit.git "$audit_dir"
          test "$(git -C "$audit_dir" rev-parse HEAD)" = \
            46024e005996495c65ef609368e11ab39c4222e3
          cp lean-toolchain "$audit_dir/"
          (cd "$audit_dir" && lake build)
          lake env "$audit_dir/.lake/build/bin/axiom-audit" \
            --allow propext,Classical.choice,Quot.sound \
            --root AssemblyP1.Issue94Complete

