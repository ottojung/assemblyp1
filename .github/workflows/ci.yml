name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check research documentation integrity
        run: python3 scripts/check-research-docs.py

  build-prereq:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "+AssemblyP1.Issue94IterSlide --wfail"
          use-github-cache: false
      - uses: actions/upload-artifact@v4
        with:
          name: prereq-build
          path: .lake/build
          include-hidden-files: true
          retention-days: 1

  build-nat-boundary:
    needs: build-prereq
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prereq-build
          path: .lake/build
      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "+AssemblyP1.Issue94InterlaceKernelNatBoundary --wfail"
          use-github-cache: false
      - uses: actions/upload-artifact@v4
        with:
          name: nat-boundary-build
          path: .lake/build
          include-hidden-files: true
          retention-days: 1

  build-boundary:
    needs: build-nat-boundary
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nat-boundary-build
          path: .lake/build
      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "+AssemblyP1.Issue94InterlaceKernelBoundary --wfail"
          use-github-cache: false
      - uses: actions/upload-artifact@v4
        with:
          name: boundary-build
          path: .lake/build
          include-hidden-files: true
          retention-days: 1

  build-interlace:
    needs: build-boundary
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boundary-build
          path: .lake/build
      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "+AssemblyP1.Issue94InterlaceKernelBase --wfail"
          use-github-cache: false
      - uses: actions/upload-artifact@v4
        with:
          name: interlace-build
          path: .lake/build
          include-hidden-files: true
          retention-days: 1

  build-color:
    needs: build-interlace
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: interlace-build
          path: .lake/build
      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "+AssemblyP1.Issue94InterlaceKernelColor --wfail"
          use-github-cache: false
      - uses: actions/upload-artifact@v4
        with:
          name: color-build
          path: .lake/build
          include-hidden-files: true
          retention-days: 1

  build-coboundary:
    needs: build-color
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: color-build
          path: .lake/build
      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "+AssemblyP1.Issue94ComponentCoboundary --wfail"
