name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check research documentation integrity
        run: python3 scripts/check-research-docs.py
      - name: Verify #263 exact support-restricted Graver certificate
        run: python3 scripts/verify_issue263_exact_support_restricted_graver.py
      - name: Verify rational circulation spelling and connected-support attainment
        run: python3 scripts/verify_unrestricted_flow_attainment.py
      - name: Verify irrational unrestricted ML non-attainment on the full DNA graph
        run: python3 scripts/verify_irrational_ml_nonattainment.py
      - name: Verify one-sided P2 law identifiability in a genome-size window
        run: python3 scripts/verify_one_sided_length_window.py
      - name: Verify complete-read historical AAATT witness and unrestricted sampling bound
        run: python3 scripts/verify_aaatt_historical_kkt.py
      - name: Verify historical coverage and finite likelihood witnesses
        run: python3 scripts/verify_historical_coverage_audit.py
      - name: Verify 247c historical same-length §6.2 witnesses
        run: python3 scripts/verify_247c_historical_witnesses.py
      - name: Verify #261 binomial finite-n and transitive-reduction regressions
        run: python3 scripts/verify_261_binomial_extreme_samples.py
      - name: Verify #261 spelled-circuit to §6.2 feasible-flow adapter
        run: python3 scripts/verify_261_spelled_flow_adapter.py
      - name: Verify #261 spelled sub-class maximality transfer and length universe
        run: python3 scripts/verify_261_spelled_flow_maximality.py
      - name: Verify #261 spelled-throughput image identity refutation
        run: python3 scripts/verify_261_spelled_flow_image_refutation.py
      - name: Verify #261 physical edge-orbit quotient and visit count
        run: python3 scripts/verify_261_physical_edge_orbit.py
      - name: Verify #261 integer-flow vs half-integral relaxation on the §6.2 flow object
        run: python3 scripts/verify_261_half_integral_source_ml.py
      - name: Verify #261 bidirected Euler circuit theorem (Layer A)
        run: python3 scripts/verify_261_bidirected_eulerian.py 2 4
      - name: Verify #259 covered-sample binomial weight criterion
        run: python3 scripts/verify_covered_binomial_weights_259.py
      - name: Verify #259 circular-genome exact-iid vs §6.1 ranking inversion
        run: python3 scripts/verify_real_genome_inversion_259.py
      - name: Verify #281 primitive-P2 (L-1)-window multiplicity cap
        run: python3 scripts/verify_281_window_cap.py 3 11 4
      - name: Verify #281 Hellinger-affinity exponential ML error decay
        run: python3 scripts/verify_281_hellinger_exponential.py
      - name: Verify #265 scoped finite-family sample-complexity bound
        run: python3 scripts/verify_sample_complexity_265.py
      - name: Verify #265 Chernoff refinement and its finite-n gap
        run: python3 scripts/verify_chernoff_finite_recovery_265.py
      - name: Verify #265 strong-consistency (strong law / KL limit) derivation
        run: python3 scripts/verify_strong_consistency_265.py
      - name: Verify #265 exact finite-n minimax recovery for one read family
        run: python3 scripts/verify_minimax_finite_recovery_265.py
      - name: Verify #300 short finite-read ML counterexamples (G=2,3,4)
        run: python3 scripts/verify_short_finite_ml_300.py
      - name: Verify #284 simultaneous-reduction scope distinction (word ≠ vertex/flow/ML)
        run: python3 scripts/verify_284_spelling_reduction_scope.py
      - name: Verify #284 read-window multiset / physical-visit transport bound
        run: python3 scripts/verify_284_visit_window_bridge.py
      - name: Verify #284 window-box sharpness refutation (no designation to equality)
        run: python3 scripts/verify_284_window_box_sharpness.py
      - name: Verify #284 §6.2 reduction dependent-classification survival matrix
        run: python3 scripts/verify_284_reduction_survival_matrix.py
      - name: Verify #284 real-model spellChain window-transport bridge
        run: python3 scripts/verify_284_spellchain_window_transport.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4

      # Reuse the Mathlib sources and its downloaded binary cache between runs.
      - name: Restore Mathlib packages and cache
        id: mathlib-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: mathlib-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # Reuse precompiled objects to avoid needless rebuilds. These are only
      # accelerators: a full library build and audit are mandatory below.
      - name: Restore compiled Lean objects
        id: compiled-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-full-${{ github.sha }}
          restore-keys: |
            lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-full-
            lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-seed-

      - name: Bootstrap from successful support-descent artifact
        id: bootstrap
        if: steps.compiled-cache.outputs.cache-matched-key == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: support-descent-build
          repository: ${{ github.repository }}
          run-id: 37842180341
          github-token: ${{ github.token }}
          path: .lake/build

      # Save the bootstrap BEFORE attempting the remaining build. A killed
      # runner can no longer discard this already-compiled baseline.
      # The proof was compiled with --wfail and kernel-replayed on the
      # matching Lean 4.34 toolchain. Never use it for changed proof sources.
      - name: Persist initial Lean checkpoint
        if: steps.compiled-cache.outputs.cache-matched-key == '' && steps.bootstrap.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-seed-${{ github.sha }}

      - name: Runner diagnostics and swap
        run: |
          echo "Memory before build"
          free -h
          df -h .
          echo "Cgroup memory limit (if applicable):"
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true
          sudo fallocate -l 6G /mnt/lean-ci.swap
          sudo chmod 600 /mnt/lean-ci.swap
          sudo mkswap /mnt/lean-ci.swap
          sudo swapon /mnt/lean-ci.swap
          free -h

      - name: Install Lean and restore Mathlib binary cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false

      # Keep heartbeat and memory diagnostics in the SAME step as the compiler.
      # A separate background step loses its log if GitHub terminates the job.
      # Persist the expensive Mathlib download independently of the project
      # build; otherwise every failed build discards it.
      - name: Persist Mathlib dependency cache
        if: steps.mathlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages
          key: mathlib-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # The endpoint module imports only a subset of the project. The default
      # Lake library target compiles every AssemblyP1/*.lean module, including
      # independent results not imported by Issue94Complete.
      - name: Build every Lean theorem module with live memory diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Full Lean library build starting ==="
          (
            while true; do
              echo "=== Build heartbeat $(date -u +%FT%TZ) ==="
              free -m
              ps -eo pid,ppid,rss,vsz,pcpu,stat,comm --sort=-rss | sed -n '1,9p'
              cat /proc/pressure/memory || true
              sleep 30
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          # Lake 4.34 does not support -j; LEAN_NUM_THREADS (set at the
          # job level) is the supported way to limit its worker threads.
          lake build --wfail

      - name: Save full compiled Lean cache
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-full-${{ github.sha }}

      # Lean 4.34 infers "Assemblyp1" from the lower-case package name
      # when no argument is passed; our actual module prefix is "AssemblyP1".
      # This prefix selects every built module, not just the final endpoint.
      - name: Replay entire Lean library through the kernel
        run: |
          LEAN_NUM_THREADS=1 lake env leanchecker AssemblyP1

      # Audit declarations from all source modules, including modules not
      # imported by the aggregator or the final #94 endpoint. In particular,
      # --modules-from avoids silently omitting standalone theorem files.
      - name: Audit axioms in every theorem module
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/axiom-audit.XXXXXX")"
          trap 'rm -rf "$workdir"' EXIT
          audit_dir="$workdir/axiom-audit"
          git clone --quiet --depth 1 --branch v0.1.2 \
            https://github.com/leanprover-community/axiom-audit.git "$audit_dir"
          test "$(git -C "$audit_dir" rev-parse HEAD)" = \
            46024e005996495c65ef609368e11ab39c4222e3
          cp lean-toolchain "$audit_dir/"
          (cd "$audit_dir" && lake build)
          lake env "$audit_dir/.lake/build/bin/axiom-audit" \
            --allow propext,Classical.choice,Quot.sound \
            --root AssemblyP1 --modules-from AssemblyP1
