  build-p2-descent:
    needs: build-same-altf
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: same-altf-build
          path: .lake/build
      - uses: leanprover/lean-action@v1
        with:
          build: true
