name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check research documentation integrity
        run: python3 scripts/check-research-docs.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4

      # Reuse the Mathlib sources and its downloaded binary cache between runs.
      - name: Restore Mathlib packages and cache
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: mathlib-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # A complete checkpoint from an earlier successful stage provides a
      # bootstrap even though the old 17-job chain never reached its final job.
      # Once a full cache exists, neither this download nor the seed save runs.
      - name: Restore compiled Lean objects
        id: compiled-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-full-${{ github.sha }}
          restore-keys: |
            lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-full-
            lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-seed-

      - name: Bootstrap from successful support-descent artifact
        id: bootstrap
        if: steps.compiled-cache.outputs.cache-matched-key == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: support-descent-build
          repository: ${{ github.repository }}
          run-id: 37842180341
          github-token: ${{ github.token }}
          path: .lake/build

      # Save the bootstrap BEFORE attempting the remaining build. A killed
      # runner can no longer discard this already-compiled baseline.
      - name: Persist initial Lean checkpoint
        if: steps.compiled-cache.outputs.cache-matched-key == '' && steps.bootstrap.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-seed-${{ github.sha }}

      - name: Runner diagnostics and swap
        run: |
          echo "Memory before build"
          free -h
          df -h .
          echo "Cgroup memory limit (if applicable):"
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true
          sudo fallocate -l 6G /mnt/lean-ci.swap
          sudo chmod 600 /mnt/lean-ci.swap
          sudo mkswap /mnt/lean-ci.swap
          sudo swapon /mnt/lean-ci.swap
          free -h

      - name: Monitor memory during Lean build
        run: |
          (
            while true; do
              date -u
              free -m
              ps -eo pid,rss,pcpu,comm --sort=-rss | head -7
              sleep 30
            done
          ) > "$RUNNER_TEMP/lean-memory.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/lean-memory.pid"

      - name: Build complete theorem with warnings as errors
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-github-cache: false
          build-args: "+AssemblyP1.Issue94Complete --wfail"

      - name: Save full compiled Lean cache
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lean-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-full-${{ github.sha }}

      - name: Audit final theorem axioms
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
          axiom-audit: true
          axiom-audit-root: AssemblyP1.Issue94Complete

      - name: Report peak build memory
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/lean-memory.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/lean-memory.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/lean-memory.log" ]; then
            tail -140 "$RUNNER_TEMP/lean-memory.log"
          fi
