name: Documents

on:
  push:
    branches: ["main"]
    tags: ["paper-v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documents-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The archived guix-install-action@v1 downloaded a floating nightly from
      # ci.guix.gnu.org/search/latest, which repeatedly returned HTTP 502.
      # The version and checksum below are independently pinned; the matching
      # installer is fetched from a specific Git commit, not a moving branch.
      # See https://github.com/monero-project/monero/blob/master/.github/workflows/guix.yml
      - name: Check LaTeX reference tokens
        run: python3 scripts/verify_tex_reference_tokens.py

      - name: Install verified GNU Guix binary
        shell: bash
        run: |
          set -euo pipefail
          archive="guix-binary-1.5.0.x86_64-linux.tar.xz"
          expected_sha256="aa41025489c5061543e9c48873eaa829b900b2da75d40f9648913622f5f47817"
          wget --tries=5 --waitretry=10 --no-verbose \
            "https://mirrors.ocf.berkeley.edu/gnu/guix/${archive}" \
            -O "/tmp/${archive}"
          echo "${expected_sha256}  /tmp/${archive}" | sha256sum -c -
          curl --fail --location --silent --show-error --retry 5 \
            "https://raw.githubusercontent.com/monero-project/guix/7fd75725c5daf9d3bdfd9122dcdb37f650493d18/etc/guix-install.sh" \
            -o /tmp/guix-install.sh
          chmod +x /tmp/guix-install.sh
          { yes "" 2>/dev/null || true; } |
            sudo env GUIX_BINARY_FILE_NAME="/tmp/${archive}" /tmp/guix-install.sh
          if [[ -f /etc/profile.d/zzz-guix.sh ]]; then
            source /etc/profile.d/zzz-guix.sh
          fi
          /usr/local/bin/guix --version

      - name: Build white paper
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/var/guix/profiles/per-user/root/current-guix/bin:${PATH}"
          bash ./paper/build.sh

      # The link is generated from the commit checked out by this CI job,
      # never a manually pinned SHA in the LaTeX source.
      - name: Install PDF-link verifier
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify revision-exact URL in reproducibility appendix
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pypdf>=5,<8"
          python scripts/verify_paper_source_link.py paper/main.pdf "$(git rev-parse HEAD)"

      - name: Upload white paper
        uses: actions/upload-artifact@v4
        with:
          name: assemblyp1-white-paper-${{ github.sha }}
          path: paper/main.pdf
          if-no-files-found: error

  publish:
    name: Publish white paper PDF
    needs: pdfs
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/paper-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified PDF build
        uses: actions/download-artifact@v4
        with:
          name: assemblyp1-white-paper-${{ github.sha }}
          path: downloaded-paper
      - name: Update rolling GitHub Release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-whitepaper-release.sh downloaded-paper/main.pdf

      - name: Publish immutable versioned PDF
        if: startsWith(github.ref, 'refs/tags/paper-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp downloaded-paper/main.pdf downloaded-paper/assemblyp1-white-paper.pdf
          gh release create "$GITHUB_REF_NAME"             "downloaded-paper/assemblyp1-white-paper.pdf"             --verify-tag             --title "The Most Likely Genome ($GITHUB_REF_NAME)"             --notes "Versioned, source-linked scientific manuscript. The signed Git tag contains the exact source and proof verification artifacts used for this PDF. For assumptions and theorem evidence, see docs/verification.md."
